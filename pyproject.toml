[project]
name = "voiceprint-system"
version = "1.2.0"
description = "ECAPA-TDNN based voiceprint recognition system with GPU auto-detection"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.6",
    "speechbrain>=0.5.14",
]

# torch and torchaudio are installed by scripts/bootstrap.py
# based on GPU detection (CUDA or CPU wheel).
# Do NOT add them here — uv sync would always install the CPU version.

[tool.uv]
package = false
