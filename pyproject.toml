[project]
name = "voiceprint-system"
version = "1.2.0"
description = "ECAPA-TDNN based voiceprint recognition system with required GPU acceleration"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.6",
    "speechbrain>=0.5.14",
]

# torch and torchaudio are installed by scripts/bootstrap.py from the CUDA wheel index.
# Do not rely on CPU wheels; runtime validation rejects CPU-only PyTorch.

[tool.uv]
package = false
