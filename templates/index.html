<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配电柜智能语音识别系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <!-- 加载遮罩 -->
        <div id="loading-overlay" class="loading-overlay">
            <div class="loading-content">
                <h2>配电柜智能语音识别系统</h2>
                <div class="spinner"></div>
                <p id="loading-text">正在加载声纹识别模型，请稍候...</p>
            </div>
        </div>

        <!-- 主界面 -->
        <header class="app-header">
            <div class="header-left">
                <h1>配电柜智能语音识别系统</h1>
            </div>
            <div class="header-right">
                <span id="status-indicator" class="status-dot status-loading"></span>
                <span id="status-text">模型加载中...</span>
                <button class="btn btn-reset" onclick="showResetDialog()">重置系统</button>
            </div>
        </header>

        <!-- 重置登录弹窗 -->
        <div id="reset-modal" class="modal-overlay" style="display:none;">
            <div class="modal-box">
                <h3>管理员验证</h3>
                <div class="form-group">
                    <label for="reset-user">账号</label>
                    <input type="text" id="reset-user" placeholder="请输入管理员账号">
                </div>
                <div class="form-group">
                    <label for="reset-pass">密码</label>
                    <input type="password" id="reset-pass" placeholder="请输入密码">
                </div>
                <div id="reset-error" class="status-msg error" style="display:none;"></div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeResetDialog()">取消</button>
                    <button class="btn btn-danger" onclick="confirmReset()">确认重置</button>
                </div>
            </div>
        </div>

        <div class="app-shell">
            <aside class="sidebar">
                <nav class="tab-nav">
                    <button class="tab-btn active" data-tab="status">系统状态</button>
                    <button class="tab-btn" data-tab="users">用户管理</button>
                    <button class="tab-btn" data-tab="register">声纹注册</button>
                    <button class="tab-btn" data-tab="verify">身份验证</button>
                    <button class="tab-btn" data-tab="logs">验证日志</button>
                </nav>
            </aside>

            <main class="tab-content">
            <!-- 系统状态 -->
            <section id="tab-status" class="tab-panel active">
                <div class="card system-card">
                    <div class="card-header">
                        <h3>系统运行状态</h3>
                        <button class="btn btn-secondary" onclick="checkModelStatus()">刷新状态</button>
                    </div>
                    <div class="status-grid">
                        <div class="status-item">
                            <span class="status-label">运行模式</span>
                            <strong id="runtime-mode">检测中</strong>
                        </div>
                        <div class="status-item">
                            <span class="status-label">GPU 设备</span>
                            <strong id="gpu-device">检测中</strong>
                        </div>
                        <div class="status-item">
                            <span class="status-label">CUDA 状态</span>
                            <strong id="cuda-state">检测中</strong>
                        </div>
                        <div class="status-item">
                            <span class="status-label">PyTorch</span>
                            <strong id="torch-state">检测中</strong>
                        </div>
                        <div class="status-item">
                            <span class="status-label">模型</span>
                            <strong id="model-state">加载中</strong>
                        </div>
                        <div class="status-item">
                            <span class="status-label">数据</span>
                            <strong id="data-state">统计中</strong>
                        </div>
                    </div>
                    <div id="gpu-detail" class="status-detail"></div>
                </div>
            </section>

            <!-- 用户管理 -->
            <section id="tab-users" class="tab-panel">
                <div class="panel-grid">
                    <div class="card">
                        <h3>添加用户</h3>
                        <form id="add-user-form">
                            <div class="form-group">
                                <label for="user-name">用户名 *</label>
                                <input type="text" id="user-name" placeholder="请输入用户名" required>
                            </div>
                            <div class="form-group">
                                <label for="user-dept">部门</label>
                                <input type="text" id="user-dept" placeholder="请输入部门">
                            </div>
                            <button type="submit" class="btn btn-primary">添加用户</button>
                        </form>
                    </div>
                    <div class="card">
                        <h3>用户列表</h3>
                        <div class="table-wrapper">
                            <table id="users-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>用户名</th>
                                        <th>部门</th>
                                        <th>声纹数</th>
                                        <th>创建时间</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="users-tbody"></tbody>
                            </table>
                        </div>
                        <button class="btn btn-secondary" onclick="loadUsers()">刷新</button>
                    </div>
                </div>
            </section>

            <!-- 声纹注册 -->
            <section id="tab-register" class="tab-panel">
                <div class="panel-grid">
                    <div class="card">
                        <h3>声纹注册</h3>
                        <div class="form-group">
                            <label for="reg-user">选择用户 *</label>
                            <select id="reg-user"></select>
                        </div>
                        <div class="form-group">
                            <label>上传音频文件</label>
                            <div class="file-upload">
                                <input type="file" id="reg-file" accept="audio/*" hidden>
                                <button class="btn btn-secondary" onclick="document.getElementById('reg-file').click()">选择文件</button>
                                <span id="reg-file-name">未选择文件</span>
                            </div>
                        </div>
                        <div class="divider"></div>
                        <div class="form-group">
                            <label>或 录制音频</label>
                            <div class="record-controls">
                                <button id="reg-record-btn" class="btn btn-record" onclick="toggleRegRecording()">
                                    <span class="record-icon"></span> 开始录音
                                </button>
                                <span id="reg-record-time" class="record-time">00:00</span>
                            </div>
                            <audio id="reg-audio-playback" controls style="display:none; width:100%; margin-top:8px;"></audio>
                        </div>
                        <button id="reg-submit-btn" class="btn btn-primary" onclick="registerVoiceprint()">注册声纹</button>
                        <div id="reg-status" class="status-msg"></div>
                    </div>
                    <div class="card">
                        <h3>引导注册（推荐）</h3>
                        <p class="hint">分段朗读文本，覆盖全音素，注册质量更高</p>
                        <div class="form-group">
                            <label for="guide-user">选择用户 *</label>
                            <select id="guide-user"></select>
                        </div>
                        <button class="btn btn-primary" onclick="startGuideRegistration()">开始引导注册</button>

                        <!-- 引导注册区域 -->
                        <div id="guide-area" style="display:none; margin-top:16px;">
                            <div class="guide-progress">
                                <span id="guide-progress-text">0/8 完成</span>
                                <div class="progress-bar">
                                    <div id="guide-progress-fill" class="progress-fill" style="width:0%"></div>
                                </div>
                            </div>
                            <div class="guide-text-card">
                                <span id="guide-category" class="guide-category"></span>
                                <p id="guide-text" class="guide-text"></p>
                                <span id="guide-tone" class="guide-tone"></span>
                            </div>
                            <div class="guide-controls">
                                <button id="guide-record-btn" class="btn btn-record" onclick="toggleGuideRecording()">
                                    <span class="record-icon"></span> 开始录音
                                </button>
                                <span id="guide-record-time" class="record-time">00:00</span>
                                <input type="file" id="guide-file" accept="audio/*" hidden>
                                <button id="guide-upload-btn" class="btn btn-secondary" onclick="document.getElementById('guide-file').click()">上传本段</button>
                                <button id="guide-skip-btn" class="btn btn-secondary" onclick="skipGuideSegment()">跳过</button>
                                <button id="guide-finish-btn" class="btn btn-primary" onclick="finishGuideRegistration()" style="display:none;">完成注册</button>
                            </div>
                            <div id="guide-quality" class="quality-indicator"></div>
                            <audio id="guide-processed-audio" controls style="display:none; width:100%; margin-bottom:12px;"></audio>
                            <div id="guide-results" class="guide-results"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 身份验证 -->
            <section id="tab-verify" class="tab-panel">
                <div class="panel-grid">
                    <div class="card">
                        <h3>语音验证</h3>
                        <div class="form-group">
                            <label>验证模式</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="verify-mode" value="identify" checked onchange="onVerifyModeChange()"> 身份识别（识别是谁）
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="verify-mode" value="verify" onchange="onVerifyModeChange()"> 身份验证（验证是否是指定用户）
                                </label>
                            </div>
                        </div>
                        <div id="verify-user-group" class="form-group" style="display:none;">
                            <label for="verify-user">选择用户</label>
                            <select id="verify-user"></select>
                        </div>
                        <div class="form-group">
                            <label>上传音频文件</label>
                            <div class="file-upload">
                                <input type="file" id="verify-file" accept="audio/*" hidden>
                                <button class="btn btn-secondary" onclick="document.getElementById('verify-file').click()">选择文件</button>
                                <span id="verify-file-name">未选择文件</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>或 录制音频</label>
                            <div class="record-controls">
                                <button id="verify-record-btn" class="btn btn-record" onclick="toggleVerifyRecording()">
                                    <span class="record-icon"></span> 开始录音
                                </button>
                                <span id="verify-record-time" class="record-time">00:00</span>
                            </div>
                            <audio id="verify-audio-playback" controls style="display:none; width:100%; margin-top:8px;"></audio>
                        </div>
                        <div class="form-group">
                            <label>相似度阈值: <span id="threshold-value">0.75</span></label>
                            <input type="range" id="threshold-slider" min="0.5" max="0.95" step="0.01" value="0.75" oninput="document.getElementById('threshold-value').textContent=this.value">
                        </div>
                        <button class="btn btn-primary" onclick="startVerification()">开始验证</button>
                        <div id="verify-status" class="status-msg"></div>
                    </div>
                    <div class="card">
                        <h3>验证结果</h3>
                        <div id="result-area">
                            <div id="result-icon" class="result-icon"></div>
                            <h3 id="result-text">等待验证...</h3>
                            <div id="result-detail" class="result-detail"></div>
                        </div>
                        <button class="btn btn-secondary" onclick="clearResult()" style="margin-top:12px;">清除结果</button>
                    </div>
                </div>
            </section>

            <!-- 验证日志 -->
            <section id="tab-logs" class="tab-panel">
                <div class="card">
                    <div class="card-header">
                        <h3>验证日志</h3>
                        <div>
                            <button class="btn btn-secondary" onclick="loadLogs()">刷新</button>
                            <button class="btn btn-danger" onclick="clearLogs()">清空日志</button>
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table id="logs-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户</th>
                                    <th>相似度</th>
                                    <th>结果</th>
                                    <th>时间</th>
                                </tr>
                            </thead>
                            <tbody id="logs-tbody"></tbody>
                        </table>
                    </div>
                    <div id="logs-stats" class="logs-stats"></div>
                </div>
            </section>
            </main>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
